[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-classifier"
version = "0.1.0"
description = "Catégorisation multi-étiquettes d'ETF par machine learning"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["slow: tests de performance (désactivables avec -m 'not slow')"]
