# Project configuration. No threshold is hard-coded in the source code.

csv:
  separator: ";"
  encoding: "utf-8"
  columns:
    name: "Name"
    description: "Description"
    composition: "Composition"
    category: "Category"

quality:
  max_weight_sum: 105.0        # above this: warning

normalize:
  strip_exchange_suffix: false # remove " US", ".PA", " UW Equity"… (disabled by default)
  aliases_path: "config/holding_aliases.csv"

dedup:
  overlap_threshold: 0.80      # minimum weighted overlap to link two ETFs
  min_common_holdings: 3       # safeguard against a single large shared holding
  max_group_share: 0.02        # warning if a group exceeds 2% of the dataset

split:
  test_size: 0.20
  seed: 42
  rare_category_min: 5         # categories below this count are listed in the report

report:
  output_path: "reports/data_quality.md"
  top_holdings: 20

costs:
  pricing_path: "config/pricing.yaml"
  usage_log_path: "logs/azure_usage.csv"
  stale_after_days: 90         # warning if the price list is older than this
  report_output_path: "reports/azure_costs.md"

features:
  blocks:                      # active blocks and their relative weight in the combined matrix
    text_tfidf: {enabled: true, weight: 1.0}
    holdings: {enabled: true, weight: 1.0}
    composition_stats: {enabled: true, weight: 1.0}
    embeddings: {enabled: true, weight: 1.0}
  text_tfidf:
    ngram_max: 2               # words and word pairs
    min_df: 2                  # a term must appear in at least 2 ETFs
    max_features: 50000
  holdings:
    min_df: 1                  # a ticker must appear in at least N training ETFs
  embeddings:
    deployment: "text-embedding-3-large"   # overridden by AZURE_OPENAI_EMBEDDING_DEPLOYMENT if set
    dimensions: 3072
    batch_size: 64
    max_tokens: 8192
    max_retries: 6             # client retries on 429 or server errors
    include_top_tickers: false # experiment: append the top 10 tickers to the text
    cache_path: "cache/embeddings.sqlite"
  artifacts_dir: "artifacts/features"

model:
  c_grid: [0.1, 1.0, 10.0]     # regularisation strengths tried (smaller value = more regularisation)
  validation_size: 0.20        # share of the training set held out for tuning
  min_positives_for_threshold: 3   # below this (in validation), default threshold
  default_threshold: 0.5
  uncertain_threshold: 0.5     # best score below this: ETF flagged as "uncertain"
  max_categories: 5            # maximum number of categories proposed per ETF
  seed: 42
  max_iter: 2000
  artifacts_dir: "artifacts/models"
  reports_dir: "reports"
  experiments:                 # active blocks of each comparable experiment
    local: {text_tfidf: true, holdings: true, composition_stats: true, embeddings: false}
    local+embeddings: {text_tfidf: true, holdings: true, composition_stats: true, embeddings: true}
    text_only: {text_tfidf: true, holdings: false, composition_stats: false, embeddings: false}
    holdings_only: {text_tfidf: false, holdings: true, composition_stats: true, embeddings: false}
    embeddings_only: {text_tfidf: false, holdings: false, composition_stats: false, embeddings: true}

similarity:
  composition_weight: 0.5      # weight of the composition similarity in the combined score
  text_weight: 0.5             # weight of the text similarity
  n_neighbors: 5               # neighbours shown by default
  n_shared_holdings: 5         # shared tickers shown to explain a match
  eval_k: [5, 10, 20]          # numbers of neighbours evaluated for the vote
  query_chunk: 256             # queries processed per batch (memory)

feedback:
  reference_csv: "data/raw/etfs.csv"       # original CSV (never rewritten)
  journal_path: "data/validations.csv"     # validation journal, appended line by line
  categories_path: "data/categories.csv"   # category registry
  backups_dir: "data/backups"
  backups_kept: 30                         # daily backups kept
  lock_timeout_seconds: 10                 # beyond this: clear error, never a write without the lock
  bias_acceptance_threshold: 0.95          # acceptance-without-change rate considered suspicious
  bias_min_validations: 50                 # minimum number of validations before raising the alert

app:
  validators:                  # team members who can validate (placeholder names: replace with the real team)
    - Alice Martin
    - Bruno Leroy
    - Chloe Dubois
  n_scores_shown: 10           # category scores shown per ETF
  history_days: 7              # default period of the history screen

retraining:
  f1_tolerance: 0.01             # candidate macro F1 >= current macro F1 - tolerance
  category_drop_max: 0.20        # maximum F1 drop allowed for a category ...
  category_min_support: 5        # ... with at least this many test examples
  min_comparison_etfs: 20        # below this, no automatic promotion
  history_path: "artifacts/models/retraining_history.csv"
  log_path: "logs/retraining.log"

llm:
  deployment: "gpt-6.1-sol"          # overridden by AZURE_OPENAI_CHAT_DEPLOYMENT (must appear in config/pricing.yaml)
  max_holdings: 10                   # largest holdings sent to the model
  max_neighbors: 5                   # closest ETFs sent to the model
  expected_output_tokens: 1500       # used for the cost estimate; reasoning tokens included
  max_completion_tokens: 4000
  max_retries: 3
  justifications_path: "data/llm_justifications.jsonl"
  cache_path: "cache/llm.sqlite"
