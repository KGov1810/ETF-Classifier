# Grille tarifaire Azure OpenAI, en USD par million de tokens.
# Mettre à jour `as_of` à chaque modification. Prix à vérifier dans votre contrat Azure :
# ils dépendent de la région et du type de déploiement.

currency: USD
as_of: "2026-10-25"
source: "Tarifs publics Data Zone Standard (borne haute de la fourchette régionale), à vérifier dans votre contrat Azure"

models:
  text-embedding-3-large:
    kind: embedding
    tokenizer: cl100k_base
    tokenizer_exact: true
    input_per_million: 0.13          # tarif standard ; tarif Data Zone non confirmé publiquement

  gpt-6.1-sol:
    kind: chat
    tokenizer: o200k_base
    tokenizer_exact: false           # tokenizer non publié : estimation approximative
    input_per_million: 2.40
    cached_input_per_million: 0.12
    output_per_million: 12.00        # inclut les tokens de raisonnement
    long_context_threshold: 272000   # au-delà (tokens d'entrée par appel), tarif long contexte
    long_context:
      input_per_million: 4.80
      cached_input_per_million: 0.24
      output_per_million: 18.00

# Nom du déploiement dans Azure → modèle de la grille.
# Adapter les noms de gauche à ceux de vos déploiements (page « Déploiements » d'Azure AI Foundry).
deployments:
  text-embedding-3-large: text-embedding-3-large
  gpt-6.1-sol: gpt-6.1-sol
