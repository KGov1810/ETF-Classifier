# Azure OpenAI price list, in USD per million tokens.
# Update `as_of` on every change. Check the prices against your Azure contract:
# they depend on the region and on the deployment type.

currency: USD
as_of: "2026-10-25"
source: "Public Data Zone Standard prices (upper end of the regional range), to be checked against your Azure contract"

models:
  text-embedding-3-large:
    kind: embedding
    tokenizer: cl100k_base
    tokenizer_exact: true
    input_per_million: 0.13          # standard price; Data Zone price not publicly confirmed

  gpt-6.1-sol:
    kind: chat
    tokenizer: o200k_base
    tokenizer_exact: false           # tokenizer not published: approximate estimate
    input_per_million: 2.40
    cached_input_per_million: 0.12
    output_per_million: 12.00        # includes reasoning tokens
    long_context_threshold: 272000   # above this (input tokens per call), long-context price
    long_context:
      input_per_million: 4.80
      cached_input_per_million: 0.24
      output_per_million: 18.00

# Azure deployment name → model of the price list.
# Change the left-hand names to match your deployments ("Deployments" page in Azure AI Foundry).
deployments:
  text-embedding-3-large: text-embedding-3-large
  gpt-6.1-sol: gpt-6.1-sol
